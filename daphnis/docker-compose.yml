services:
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - webserver
    command: certonly --webroot --webroot-path=/var/www/html --email alex.nebula99@gmail.com --agree-tos --no-eff-email --force-renewal -d compendium.owlbear.tech

  database:
    image: postgres:13-alpine
    container_name: database
    restart: unless-stopped
    ports:
      - "3976:5432"
    volumes:
      - "${DATABASE_DIRECTORY_POSTGRES}:/var/lib/postgresql/data"
    networks:
      - app-network

  dnd-compendium:
    image: alexgs99/dnd-compendium:1.0.0
    container_name: dnd-compendium
    restart: unless-stopped
    env_file: dnd-compendium.env
    networks:
      - app-network

  electric-lounge:
    image: alexgs99/electric-lounge:0.1.0
    container_name: electric-lounge
    restart: unless-stopped
    env_file: electric-lounge.env
    networks:
      - app-network

  webserver:
    image: nginx:mainline-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - web-root:/var/www/html
      - ./nginx:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - dhparam:/etc/ssl/certs
    depends_on:
      - dnd-compendium
      - electric-lounge
    networks:
      - app-network

volumes:
  certbot-etc:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/certbot-etc/
      o: bind
  certbot-var:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/certbot-var/
      o: bind
  dhparam:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/dhparam/
      o: bind
  web-root:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/web-root/
      o: bind

networks:
  app-network:
    driver: bridge

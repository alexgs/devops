version: '3'

vars:
  INIT_NAME: postgres-init-container

dotenv: ['.env']

tasks:
  down:
    cmds:
      - docker-compose down --remove-orphans
    desc: Tear down the application

  up:
    cmds:
      - docker-compose up -d
    desc: Spin-up the application

  # --- DATABASE COMMANDS ---

  db:psql:
    cmds:
      - "psql -h localhost -p $DATABASE_PORT -U $DATABASE_DDC_USER -d $DATABASE_DDC_NAME"
    desc: Connect to the Postgres cluster with the `psql` tool

  # - Hidden database commands -

  # Connect to the Postgres cluster **AS THE ADMIN USER** with the `psql` tool
  db:psql-admin: "psql -h localhost -p $DATABASE_PORT -U $DATABASE_ADMIN_USER -d $DATABASE_DDC_NAME"

  # - Hidden & dangerous database commands -

  # Initialize the __host__ Postgres data directory
  db:DANGEROUS:initialize:
    cmds:
      - task: private:db:initialize-0-make-directory
      - task: private:db:initialize-1-start-container
      - task: private:db:initialize-2-sleep
      - task: private:db:initialize-3-stop-container
      - echo "Initialization complete."

  # --- PRIVATE COMMANDS ---

  private:db:initialize-0-make-directory: mkdir -p $DATABASE_DIRECTORY_POSTGRES

  private:db:initialize-1-start-container: docker run --rm --name {{.INIT_NAME}} -d -p 5432:5432
    -e POSTGRES_DB=$DATABASE_DDC_NAME
    -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    -e POSTGRES_INITDB_ARGS="--auth=scram-sha-256"
    -e POSTGRES_PASSWORD=$DATABASE_ADMIN_PASSWORD
    -e POSTGRES_USER=$DATABASE_ADMIN_USER
    -v $DATABASE_DIRECTORY_POSTGRES:/var/lib/postgresql/data
    postgres:13-alpine

  private:db:initialize-2-sleep: sleep 15s

  private:db:initialize-3-stop-container: docker stop {{.INIT_NAME}}

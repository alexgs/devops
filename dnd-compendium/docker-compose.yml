version: '3'

services:
  dnd-compendium:
    image: alexgs99/dnd-compendium
    container_name: dnd-compendium
    restart: unless-stopped
    environment:
      - AUTH0_DOMAIN
      - AUTH0_CLIENT_ID
      - AUTH0_CLIENT_SECRET
      - DATABASE_URL
      - FONTAWESOME_NPM_AUTH_TOKEN
      - PROTOCOL_AND_HOST
      - RANDOMLY_GENERATED_SECRET
    networks:
      - app-network
  webserver:
    image: nginx:mainline-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - web-root:/var/www/html
      - ./nginx:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - dhparam:/etc/ssl/certs
    depends_on:
      - dnd-compendium
    networks:
      - app-network
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - webserver
    command: certonly --webroot --webroot-path=/var/www/html --email alex.nebula99@gmail.com --agree-tos --no-eff-email --force-renewal -d compendium.owlbear.tech

volumes:
  certbot-etc:
  certbot-var:
  dhparam:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/dhparam/
      o: bind
  web-root:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/web-root/
      o: bind

networks:
  app-network:
    driver: bridge

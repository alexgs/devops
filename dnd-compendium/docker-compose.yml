version: '3'

services:
  dnd-compendium:
    image: alexgs99/dnd-compendium
    container_name: dnd-compendium
    restart: unless-stopped
    environment:
      - AUTH0_DOMAIN
      - AUTH0_CLIENT_ID
      - AUTH0_CLIENT_SECRET
      - DATABASE_URL
      - FONTAWESOME_NPM_AUTH_TOKEN
      - RANDOMLY_GENERATED_SECRET
    networks:
      - app-network
  webserver:
    image: nginx:mainline-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - dnd-compendium
    networks:
      - app-network

volumes:
  certbot-etc:
  certbot-var:

networks:
  app-network:
    driver: bridge

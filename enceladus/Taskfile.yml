version: '3'

vars:
  CONVEX_SERVICE: convex
  SKYREACH_SERVICE: skyreach
  WESTWOOD_SERVICE: westwood

dotenv: ['.env']

tasks:
  down:
    cmds:
      - docker compose down --remove-orphans
    desc: Tear down the application

  up:
    cmds:
      - docker compose up -d
    desc: Spin-up the application

  # --- CONVEX COMMANDS ---

  convex:logs:
    cmds:
      - "docker compose logs -f {{.CONVEX_SERVICE}}"
    desc: Follow logs for Convex service

  convex:restart:
    cmds:
      - "docker compose restart {{.CONVEX_SERVICE}}"
    desc: Restart Convex service

  convex:shell:
    cmds:
      - "docker exec -it {{.CONVEX_SERVICE}} sh"
    desc: Open a shell on the Convex container

  convex:update:
    cmds:
      - docker pull ghcr.io/alexgs/convex:latest
      - docker compose up -d {{.CONVEX_SERVICE}}
    desc: Pull latest Convex image and restart service

  # --- SKYREACH COMMANDS ---

  skyreach:logs:
    cmds:
      - "docker compose logs -f {{.SKYREACH_SERVICE}}"
    desc: Follow logs for Skyreach service

  skyreach:restart:
    cmds:
      - "docker compose restart {{.SKYREACH_SERVICE}}"
    desc: Restart Skyreach service

  skyreach:shell:
    cmds:
      - "docker exec -it {{.SKYREACH_SERVICE}} sh"
    desc: Open a shell on the Skyreach container

  skyreach:update:
    cmds:
      - docker pull ghcr.io/alexgs/skyreach:main
      - docker compose up -d {{.SKYREACH_SERVICE}}
    desc: Pull latest Skyreach image and restart service

  # --- TRAEFIK COMMANDS ---

  traefik:logs:
    cmds:
      - "docker compose logs -f webserver"
    desc: Follow logs for Traefik service

  # --- WESTWOOD COMMANDS ---

  westwood:logs:
    cmds:
      - "docker compose logs -f {{.WESTWOOD_SERVICE}}"
    desc: Follow logs for Westwood service

  westwood:restart:
    cmds:
      - "docker compose restart {{.WESTWOOD_SERVICE}}"
    desc: Restart Westwood service

  westwood:shell:
    cmds:
      - "docker exec -it {{.WESTWOOD_SERVICE}} sh"
    desc: Open a shell on the Westwood container

  westwood:update:
    cmds:
      - docker pull ghcr.io/alexgs/westwood:latest
      - docker compose up -d {{.WESTWOOD_SERVICE}}
    desc: Pull latest Westwood image and restart service

  westwood:db:psql:
    cmds:
      - "docker exec -it westwood-db psql -U westwood -d westwood"
    desc: Connect to the Westwood database with psql

  # --- CRON JOBS --- (Hidden)
  # Invoked by /etc/crontab on enceladus per crontab.txt; not normally
  # called by hand.

  cron:westwood-snapshot:
    cmds:
      - bash /home/alexgs/devops/enceladus/scripts/westwood-snapshot.sh
    silent: true

  cron:westwood-snapshot-prune:
    cmds:
      - bash /home/alexgs/devops/enceladus/scripts/westwood-snapshot-prune.sh
    silent: true

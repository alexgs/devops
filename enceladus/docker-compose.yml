services:
  convex:
    image: ghcr.io/alexgs/convex:latest
    container_name: convex
    restart: unless-stopped
    env_file: convex.env
    volumes:
      - logs:/app/logs
    networks:
      - webapp-net
    labels:
      - "traefik.http.routers.convex.rule=Host(`convex.alexgs.me`)"
      - "traefik.http.routers.convex.tls=true"
      - "traefik.http.routers.convex.tls.certresolver=enceladus-resolver"
      - "traefik.http.services.convex.loadbalancer.server.port=4322"

  # https://github.com/Tecnativa/docker-socket-proxy
  soxy-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: soxy-proxy
    networks:
      - socker-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1

  webserver:
    image: traefik:3.2
    container_name: webserver
    restart: unless-stopped
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./letsencrypt:/letsencrypt
      - ./traefik:/etc/traefik
    depends_on:
      - convex
      - soxy-proxy
    networks:
      - webapp-net
      - socker-net

volumes:
  logs:
    driver: local
    driver_opts:
      type: none
      device: /home/alexgs/devops/enceladus/logs/
      o: bind

networks:
  webapp-net:
    driver: bridge
    name: webapp-net
  socker-net:
    driver: bridge
    driver_opts:
      encrypted: 'true' # We're passing Docker socket stuff over TCP, so encrypt
    name: socker-net
